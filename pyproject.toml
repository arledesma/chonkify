[project]
name = "chonkify"
version = "0.2.2"
description = "Extractive document compression that preserves what matters."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [
    { name = "Thomas \"Thom\" Heinrich", email = "th@thomheinrich.de" },
]
keywords = ["document-compression", "compaction", "semantic-mmr", "llm-context"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0.0"]

[project.scripts]
chonkify = "chonkify.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chonkify"]
