[project]
name = "chonkify"
version = "0.2.2"
description = "Extractive document compression that preserves what matters."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [
    { name = "Thomas \"Thom\" Heinrich", email = "th@thomheinrich.de" },
]
keywords = ["document-compression", "compaction", "semantic-mmr", "llm-context"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0.0"]
local-cu124 = ["sentence-transformers>=3.0.0", "torch>=2.5.1"]
local-cu128 = ["sentence-transformers>=3.0.0", "torch>=2.8.0"]
local-cu130 = ["sentence-transformers>=3.0.0", "torch>=2.9.1"]

[project.scripts]
chonkify = "chonkify.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chonkify"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "local" },
        { extra = "local-cu124" },
        { extra = "local-cu128" },
        { extra = "local-cu130" },
    ],
]

[tool.uv.sources]
chonkify = { workspace = true }
torch = [
    { index = "pytorch-cu124", extra = "local-cu124" },
    { index = "pytorch-cu128", extra = "local-cu128" },
    { index = "pytorch-cu130", extra = "local-cu130" },
]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.2",
]
